name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
     # DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      DATABASE_URL: "mysql://user:pass@localhost:3306/db"    
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # Multi-organisation layout (deploy/MULTI_TENANT.md): one build,
            # one pm2 process per /etc/onebit/*.env. Until the server is moved
            # there (portal.env exists), deploy the single-organisation app.
            cd /var/www/monitoring
            if [ -f /etc/onebit/portal.env ]; then
              git checkout -- package-lock.json
              git pull origin main
              npm ci
              # prisma generate needs a URL but never connects; runtime
              # config comes from /etc/onebit/*.env, not from a .env here.
              DATABASE_URL="mysql://build:build@127.0.0.1:3306/build" npm run build
              pm2 startOrReload ecosystem.config.cjs --update-env
              pm2 save
            else
              git checkout -- package-lock.json
              git pull origin main
              npm install
              # npx prisma migrate deploy
              npm run build
              pm2 restart monitoring
            fi
